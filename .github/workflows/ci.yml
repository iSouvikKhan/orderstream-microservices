name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers uses the Docker daemon available on GitHub-hosted runners.
      - name: Build and run unit + Testcontainers integration tests
        run: mvn -B verify

  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t orderstream/${{ matrix.service }}:${{ github.sha }} .
