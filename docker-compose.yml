name: orderstream

x-service-env: &service-env
  DB_USERNAME: orderstream
  DB_PASSWORD: orderstream
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-depends: &depends
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderstream
      POSTGRES_PASSWORD: orderstream
      POSTGRES_DB: orderstream
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderstream"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    image: orderstream/order-service:latest
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
    depends_on: *depends

  inventory-service:
    build: { context: ., args: { SERVICE: inventory-service } }
    image: orderstream/inventory-service:latest
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory
    depends_on: *depends

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    image: orderstream/payment-service:latest
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payments
    depends_on: *depends

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    image: orderstream/notification-service:latest
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications
    depends_on: *depends

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    image: orderstream/api-gateway:latest
    ports: ["8080:8080"]
    environment:
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-this-is-a-dev-only-secret-key-0123456789}
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

volumes:
  pgdata:
