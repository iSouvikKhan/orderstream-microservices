apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: orderstream
data:
  init-databases.sql: |
    CREATE DATABASE orders;
    CREATE DATABASE inventory;
    CREATE DATABASE payments;
    CREATE DATABASE notifications;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: orderstream
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: orderstream-secrets }
          env:
            - { name: POSTGRES_DB, value: orderstream }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "orderstream"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orderstream
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
