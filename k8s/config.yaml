apiVersion: v1
kind: ConfigMap
metadata:
  name: orderstream-config
  namespace: orderstream
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  ORDER_SERVICE_URL: http://order-service:8081
  INVENTORY_SERVICE_URL: http://inventory-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  NOTIFICATION_SERVICE_URL: http://notification-service:8084
---
# Dev values only. In a real cluster create this from a secret manager (e.g. External Secrets / Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: orderstream-secrets
  namespace: orderstream
type: Opaque
stringData:
  DB_USERNAME: orderstream
  DB_PASSWORD: orderstream
  POSTGRES_USER: orderstream
  POSTGRES_PASSWORD: orderstream
  JWT_SECRET: change-me-this-is-a-dev-only-secret-key-0123456789
